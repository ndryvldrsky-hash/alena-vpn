# 2026-11-08: порт 443 делим по SNI. vpn.kulagin.org → Xray Reality на Кузнице (через Коин, путь как у 8443);
# всё остальное → местный nginx на 127.0.0.1:4443 с proxy_protocol (настоящие адреса в логах).
# Причина: ТСПУ Билайна глушит TLS к этому адресу на 8443 после первого пакета, а 443 пропускает.
map $ssl_preread_server_name $sni443 {
    vpn.kulagin.org   10.77.0.3:8443;
    default           127.0.0.1:4444;
}
server {
    listen 167.99.95.129:443;
    ssl_preread on;
    proxy_pass $sni443;
    proxy_connect_timeout 10s;
}
server {
    listen 127.0.0.1:4444;
    proxy_pass 127.0.0.1:4443;
    proxy_protocol on;
}
