# v.kulagin.org — волонтёрская запись на встречи (2026-09-26). Статика /var/www/v.kulagin.org, запись — служба
# volunteer-book (127.0.0.1:8091). Слушаем конкретный публичный IP, как и kulagin.org: 0.0.0.0:443 занят tailscaled.
server {
    server_name v.kulagin.org;
    root /var/www/v.kulagin.org;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/v.kulagin.access.log;
    location / { try_files $uri $uri/ =404; }
    location /api/v/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    listen 167.99.95.129:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/v.kulagin.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v.kulagin.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = v.kulagin.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name v.kulagin.org;
    listen 167.99.95.129:80;
    return 404; # managed by Certbot


}