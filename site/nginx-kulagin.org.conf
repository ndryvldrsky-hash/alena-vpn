server {
    server_name kulagin.org www.kulagin.org;
    root /var/www/kulagin.org;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/kulagin.access.log;
    location / { try_files $uri $uri/ =404; }
    # чат с Алёной: служба alena-chat (127.0.0.1:8090), ответ идёт потоком SSE — без буферизации
    location /api/chat {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    listen 167.99.95.129:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kulagin.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kulagin.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.kulagin.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = kulagin.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 167.99.95.129:80;
    server_name kulagin.org www.kulagin.org;
    return 404; # managed by Certbot




}